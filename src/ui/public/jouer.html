<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur de partition</title>
<style>
  :root {
    --bg: #111317; --panel: #1b1e24; --ink: #f1f2f4; --muted: #9aa0aa; --line: #2e323a; --accent: #e48bad;
    --ok: #3fb56f; --warn: #f0a33a; --err: #f0574a;
    --t-citation: #4a8fd6; --t-diapo: #3aa36f; --t-question: #d65b93; --t-contribution: #e0913a; --t-diagramme: #9373d1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }
  .type { font-size: 13px; padding: 2px 10px; border-radius: 999px; color: #fff; }
  .spacer { flex: 1; }
  .chrono { font: 600 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 12px; border-radius: 8px; background: var(--ok); color: #08130c; min-width: 150px; text-align: center; transition: background .3s; }
  .chrono.warning { background: var(--warn); color: #1d1200; }
  .chrono.danger { background: var(--err); color: #fff; }
  .chrono.idle { background: var(--line); color: var(--ink); }
  .chrono small { font-size: 12px; font-weight: 500; opacity: .8; }
  .total { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  .nav { display: flex; gap: 4px; align-items: center; }
  button, select, input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #1f0a14; border-color: var(--accent); font-weight: 650; }
  button:disabled { opacity: .45; cursor: default; }
  input.goto { width: 64px; cursor: text; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  main { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #000; }
  /* cadre des écrans : toujours 1920 × 1080, mis à l'échelle de la fenêtre (bandes noires si les proportions diffèrent),
     pour que le contenu et les annotations (coordonnées relatives au cadre) soient au même endroit sur tous les appareils */
  .frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; container-type: size; background: var(--bg); overflow: hidden; }
  .stage { position: absolute; inset: 0; padding: 3cqh 4cqw; display: flex; flex-direction: column; overflow: auto; }
  .stage.full { padding: 0; }
  .center { margin: auto; max-width: 1100px; width: 100%; }
  blockquote.citation { font-size: clamp(22px, 3.2cqw, 44px); line-height: 1.35; margin: 0; font-family: Georgia, "Times New Roman", serif; }
  blockquote.citation::before { content: "« "; color: var(--t-citation); }
  blockquote.citation::after { content: " »"; color: var(--t-citation); }
  .cite-media { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 3cqw; align-items: center; }
  .cite-media img { width: 100%; max-height: 72cqh; object-fit: contain; background: #fff; border-radius: 10px; display: block; }
  blockquote.citation.from-image { font-size: clamp(18px, 2.2cqw, 32px); }
  .ref a.page-link { color: var(--accent); }
  .ref { margin-top: 3cqh; font-size: clamp(15px, 1.5cqw, 22px); color: var(--muted); }
  .comment { margin-top: 2cqh; font-size: clamp(14px, 1.3cqw, 19px); border-left: 3px solid var(--t-citation); padding-left: 12px; color: var(--ink); opacity: .85; }
  .question { font-size: clamp(26px, 4cqw, 58px); line-height: 1.25; font-weight: 650; }
  .intention { margin-top: 2cqh; font-size: clamp(14px, 1.4cqw, 20px); color: var(--muted); }
  .sources { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4cqh; align-items: flex-start; }
  .sources .src { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: 360px; color: var(--muted); }
  .sources img { width: 240px; border-radius: 6px; display: block; }
  iframe.slide, iframe.contrib { width: 100%; height: 100%; border: 0; background: #fff; }
  .contrib-layout { display: grid; grid-template-columns: minmax(220px, 26%) 1fr; gap: 16px; height: 100%; }
  .contrib-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .qr { background: #fff; padding: 10px; border-radius: 10px; width: 100%; max-width: 280px; aspect-ratio: 1; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .form-link { font-size: 12px; color: var(--muted); word-break: break-all; }
  .contribs { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .contribs .c { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .contribs .c.on { border-color: var(--t-contribution); }
  .contribs .c .u { color: var(--muted); font-size: 12px; word-break: break-all; }
  .contrib-main { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); min-height: 0; }
  .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; color: var(--muted); }
  .placeholder a { color: var(--accent); font-size: 18px; word-break: break-all; }
  .diagram { background: #fff; color: #111; border-radius: 10px; padding: 2cqh 2cqw; margin-top: 2cqh; display: flex; justify-content: center; }
  .diagram svg { max-width: 100%; height: auto; max-height: 70cqh; }
  h2.screen-title { font-size: clamp(20px, 2.4cqw, 32px); margin: 0 0 1cqh; }
  pre.code { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  footer { display: flex; height: 14px; cursor: pointer; }
  footer span { flex: 1; opacity: .45; border-right: 1px solid var(--bg); position: relative; }
  footer span.visited { opacity: .75; }
  footer span.current { opacity: 1; box-shadow: inset 0 -4px 0 #fff; }
  /* suivi : écran affiché par le présentateur */
  footer span.live { opacity: 1; }
  footer span.live::after { content: ""; position: absolute; left: 50%; top: 2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 2px var(--bg); }
  #b-live.pulse { animation: pulse 1s ease-out 3; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,87,74,.7); } 100% { box-shadow: 0 0 0 10px rgba(240,87,74,0); } }
  .overlay { position: absolute; inset: 0; background: rgba(10,11,14,.88); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; max-width: 560px; text-align: center; }
  .overlay h2 { margin-top: 0; }
  a.home { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
  a.home:hover { color: var(--accent); }
  .qr-corner { position: absolute; right: 14px; bottom: 14px; z-index: 5; background: #fff; color: #111; border-radius: 10px; padding: 6px 6px 4px; width: 128px; text-align: center; font-size: 11px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.35); cursor: pointer; }
  .qr-corner svg { width: 100%; height: auto; display: block; }
  .qr-corner.small { width: 64px; font-size: 0; padding: 4px; }
  .zoom-wrap { position: relative; overflow: hidden; cursor: grab; touch-action: none; height: 68cqh; user-select: none; -webkit-user-select: none; }
  .zoom-wrap.dragging { cursor: grabbing; }
  .zoom-inner { transform-origin: 0 0; display: inline-block; }
  .zoom-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
  .zoom-tools button { background: #fff; color: #111; border-color: #ccc; padding: 2px 9px; }
  .contribs .c .tools { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .contribs .c .tools button { padding: 2px 8px; font-size: 12px; }
  .contribs .c .edited { color: var(--t-contribution); font-size: 11px; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 8; overflow: auto; padding: 14px 16px; box-shadow: -8px 0 24px rgba(0,0,0,.35); --accent-ink: #1f0a14; }
  .instruction { font-size: clamp(16px, 1.6cqw, 22px); color: var(--ink); margin-bottom: 4px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }
  .captions { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: max-content; max-width: min(1100px, 90%); background: rgba(0,0,0,.8); color: #fff; font-size: clamp(18px, 2vw, 30px); line-height: 1.35; padding: 8px 18px; border-radius: 8px; z-index: 6; text-align: center; pointer-events: none; }
  .captions .interim { opacity: .7; font-style: italic; }
  #b-mic.on { background: var(--err); border-color: var(--err); color: #fff; box-shadow: 0 0 0 calc(var(--lvl, 0) * 9px) rgba(240,87,74,.35); }
  #b-cc.on { border-color: var(--accent); color: var(--accent); }
  .tr-tools { display: grid; gap: 8px; margin: 10px 0 14px; font-size: 14px; }
  .tr-tools label { display: flex; gap: 8px; align-items: center; }
  .tr-tools .help { color: var(--muted); font-size: 12.5px; }
  .tr-seg { margin: 8px 0; font-size: 14.5px; line-height: 1.45; }
  .tr-seg .t { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; margin-right: 6px; cursor: pointer; }
  /* annotations : traits sur l'écran, palette de la grille, surlignage de la transcription */
  canvas.ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; touch-action: none; }
  canvas.ink.drawing { pointer-events: auto; cursor: crosshair; }
  .palette { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 7; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; background: rgba(17,19,23,.92); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; max-width: 94%; }
  .palette .sw { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 9px 3px 4px; }
  .palette .sw i, .hl-pop i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; border: 2px solid rgba(255,255,255,.3); }
  .palette .sw.on { border-color: #fff; background: #2a2e36; }
  .palette .tools { display: flex; gap: 4px; margin-left: 6px; }
  .palette .tools button { font-size: 13px; padding: 3px 8px; }
  .palette .tool { font-size: 15px; padding: 3px 8px; min-width: 34px; }
  .palette .tool.on { border-color: #fff; background: #2a2e36; }
  .palette .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .callout-input { position: absolute; z-index: 5; transform: translate(-50%, -50%); width: 460px; min-height: 70px; font: 28px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: rgba(255,255,255,.97); border: 4px solid var(--c, #ffd400); border-radius: 14px; padding: 10px 14px; resize: none; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .hl-pop { position: fixed; z-index: 40; display: flex; flex-wrap: wrap; gap: 4px; max-width: 320px; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .hl-pop button { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 8px 3px 4px; }
  .tr-seg mark { color: inherit; border-radius: 3px; padding: 0 1px; cursor: help; }
  .tr-seg mark.mine { cursor: pointer; outline: 1px dashed rgba(255,255,255,.45); }
  .tr-seg .tx { user-select: text; -webkit-user-select: text; }
  #b-draw.on, #b-ink.on { border-color: var(--accent); color: var(--accent); }
  #b-live { border-color: var(--err); color: var(--err); font-weight: 650; }
  .who-am-i { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .who-am-i button { font-size: 12px; padding: 1px 6px; margin-left: 4px; }
  .panel-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .ann-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: start; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13.5px; }
  .ann-row .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; }
  .ann-row .meta { color: var(--muted); font-size: 12px; }
  .ann-row .what { overflow-wrap: anywhere; }
  .ann-row button { font-size: 12px; padding: 1px 7px; }
  .person { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .person .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .person .head strong { font-size: 14.5px; }
  .person .meta { color: var(--muted); font-size: 12.5px; }
  .person .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 4px; }
  .person .live-dot.off { background: var(--warn); }
  .person details { margin-top: 6px; }
  .person summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .share-box { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 6px 0 12px; font-size: 13px; }
  .share-box .qr-mini { background: #fff; border-radius: 8px; padding: 6px; width: 120px; }
  .share-box a { color: var(--accent); word-break: break-all; }
  .hidden { display: none !important; }
  /* le contenu des écrans est toujours mis en page à 1920 px de large (cadre) : seul l'en-tête s'adapte */
  @media (max-width: 800px) { header h1 { max-width: 60vw; } }
</style>
</head>
<body>
<header>
  <a class="home" href="/" title="Retour à la liste des partitions">← Partitions</a>
  <h1 id="title">Chargement…</h1>
  <span id="type" class="type"></span>
  <span id="pos" class="badge"></span>
  <span id="mode" class="badge"></span>
  <div class="spacer"></div>
  <div id="chrono" class="chrono idle" title="Temps passé sur l'écran / durée prévue">0:00 <small>/ 0:00</small></div>
  <span id="total" class="total"></span>
  <div class="nav">
    <button id="b-first" title="Début (Début)">⏮</button>
    <button id="b-prev" title="Écran précédent (←)">◀</button>
    <input id="b-goto" class="goto" type="number" min="1" title="Aller à l'écran (G)">
    <button id="b-next" title="Écran suivant (→)">▶</button>
    <button id="b-last" title="Fin (Fin)">⏭</button>
    <button id="b-back" title="Revenir à l'écran précédemment affiché (R)">↩</button>
  </div>
  <span id="replay-ctl" class="nav hidden">
    <button id="b-play" title="Lecture / pause (espace)">⏯</button>
    <select id="b-speed" title="Vitesse du rejeu"><option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10" selected>×10</option><option value="30">×30</option></select>
  </span>
  <button id="b-edit" title="Modifier cet écran (E)">✎</button>
  <button id="b-live" class="hidden" title="Revenir à l'écran affiché par le présentateur (L)">● Direct</button>
  <button id="b-mic" title="Transcrire la parole du présentateur (T)">🎙</button>
  <button id="b-cc" title="Sous-titres sur l'écran (S)">CC</button>
  <button id="b-transcript" title="Transcription : texte, réglages et surlignage">📝</button>
  <button id="b-draw" title="Annoter l'écran avec la grille de couleurs (D)">✏️</button>
  <button id="b-ink" title="Afficher ou masquer les annotations (A)">👁</button>
  <button id="b-anns" title="Annotations de cet écran : qui, quoi, à quelle heure (N)">🗂 <span id="anns-count"></span></button>
  <button id="b-follow" title="Suivre la présentation sur un autre appareil">👥 <span id="followers"></span></button>
  <span id="who-am-i" class="who-am-i hidden"></span>
  <button id="b-full" title="Plein écran (F)">⛶</button>
  <button id="b-end" class="primary">Terminer et enregistrer</button>
</header>
<main>
  <div id="frame" class="frame">
    <div id="stage" class="stage"></div>
    <canvas id="ink" class="ink"></canvas>
  </div>
  <div id="qr-corner" class="qr-corner hidden" title="Participer : flasher le QR code (clic pour réduire, touche Q)"></div>
  <div id="palette" class="palette hidden"></div>
  <div id="captions" class="captions hidden"><span class="final"></span> <span class="interim"></span></div>
  <div id="drawer" class="drawer hidden"></div>
  <div id="overlay" class="overlay hidden"><div class="box" id="overlay-box"></div></div>
</main>
<footer id="progress"></footer>
<div class="toast" id="toast"></div>
<div id="hl-pop" class="hl-pop hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "strict" });

const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...children) => {
  const e = Object.assign(document.createElement(tag), props);
  for (const c of children.flat()) if (c != null && c !== false) e.append(c);
  return e;
};
const api = async (url, opts = {}) => {
  const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body && JSON.stringify(opts.body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const LABELS = { citation: "Citation", diapo: "Diapo", question: "Question", contribution: "Contributions", diagramme: "Diagramme" };
const qrSvg = text => { if (!window.qrcode || !text) return ""; const q = window.qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); };

// cadre 1920 × 1080 mis à l'échelle de la zone d'affichage (centré)
const FRAME_W = 1920, FRAME_H = 1080;
let frameScale = 1;
function fitFrame() {
  const m = document.querySelector("main"), f = document.getElementById("frame");
  if (!m || !f) return;
  frameScale = Math.min(m.clientWidth / FRAME_W, m.clientHeight / FRAME_H) || 1;
  f.style.transform = `translate(${(m.clientWidth - FRAME_W * frameScale) / 2}px, ${(m.clientHeight - FRAME_H * frameScale) / 2}px) scale(${frameScale})`;
  if (typeof drawInk === "function") drawInk();
}
new ResizeObserver(fitFrame).observe(document.querySelector("main"));

const params = new URLSearchParams(location.search);
// rejeu public (/public/rejeu?t=<jeton>) : lecture seule, ni participation ni modification des liens
const PUBLIC = location.pathname === "/public/rejeu";
const token = params.get("t");
let runId = params.get("run");
const replayId = params.get("replay");
const REPLAY = PUBLIC || !!replayId;
// suivi sur un autre appareil (/public/suivre?run=…, après connexion) : les écrans suivent ceux du présentateur
const FOLLOW = location.pathname === "/public/suivre";
const DRAFT_KEY = `chaoticum:seance:${runId}`;
const store = {
  get() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) ?? "null"); } catch { return null; } },
  set(v) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(v)); } catch { /* stockage indisponible */ } },
  clear() { try { localStorage.removeItem(DRAFT_KEY); } catch { /* stockage indisponible */ } },
};

let P = null;                 // partition
let current = 0, previous = null;
// séance en direct
let started = false, startedAt = null, enteredAt = Date.now(), events = [], saved = false;
const contributions = new Map(); // id → { id, name, url, date, receivedAt, screenIndex, shownAt, shownScreen }
let baseline = null, allRows = [], shownByScreen = new Map(), pollTimer = null;
// modifications et suppressions de contributions par l'animateur : id → { url?, deleted?, at, applied }
const overrides = new Map();
// rejeu
let R = null, rIdx = 0, rElapsed = 0, playing = false, lastTick = Date.now();
// transcription de la parole du présentateur : passages { at, duration, screen, text, engine }
let transcript = [];

// ==========================================
// Chronomètre
// ==========================================
function status(seconds, planned) {
  const r = seconds / Math.max(1, planned);
  return r <= P.timer.warning ? "ok" : r <= P.timer.danger ? "warning" : "danger";
}
function tick() {
  if (!P) return;
  const s = P.screens[current];
  let elapsed, total;
  if (REPLAY) {
    const now = Date.now();
    if (playing) rElapsed += ((now - lastTick) / 1000) * Number($("#b-speed").value);
    lastTick = now;
    const ev = R?.events?.[rIdx];
    if (playing && ev && rElapsed >= ev.seconds) { if (rIdx < R.events.length - 1) replayGo(rIdx + 1); else { playing = false; toast("Fin du rejeu"); } }
    elapsed = rElapsed;
    total = (R?.events ?? []).slice(0, rIdx).reduce((n, e) => n + e.seconds, 0) + rElapsed;
    if (s.type === "contribution") renderReplayContribution();

  } else if (FOLLOW) {

    elapsed = liveState.live && current === liveState.current && liveState.enteredAt ? (Date.now() - new Date(liveState.enteredAt).getTime()) / 1000 : 0;
    total = liveState.live && liveState.session ? (Date.now() - new Date(liveState.session).getTime()) / 1000 : 0;
  } else {
    elapsed = started ? (Date.now() - enteredAt) / 1000 : 0;
    total = started ? (Date.now() - new Date(startedAt).getTime()) / 1000 : 0;
  }
  if (REPLAY && R?.annotations?.length) drawInk();
  const c = $("#chrono");
  c.className = `chrono ${started || REPLAY || (FOLLOW && liveState.live) ? status(elapsed, s.duration) : "idle"}`;
  c.innerHTML = `${mmss(elapsed)} <small>/ ${mmss(s.duration)}</small>`;
  const plannedNow = P.screens.slice(0, current).reduce((n, x) => n + x.duration, 0) + Math.min(elapsed, s.duration);

function closeEvent() {
  if (!started || REPLAY) return;
  const s = P.screens[current];
  const seconds = (Date.now() - enteredAt) / 1000;
  if (seconds < 1) return;
  events.push({ index: current, type: s.type, enteredAt: new Date(enteredAt).toISOString(), leftAt: new Date().toISOString(), seconds: Math.round(seconds * 10) / 10, planned: s.duration, status: status(seconds, s.duration) });
}
function go(i) {
  if (!P) return;
  i = Math.max(0, Math.min(P.screens.length - 1, i));
  if (REPLAY) { // en rejeu, la navigation suit les passages enregistrés
    const k = R.events.findIndex((e, n) => n >= (i > current ? rIdx + 1 : 0) && e.index === i);
    if (k >= 0) replayGo(k); else toast("Écran non parcouru pendant cette séance");
    return;
  }
  if (i === current) return;
  if (FOLLOW) { // navigation libre : on « décroche » du présentateur jusqu'au retour au direct
    previous = current; current = i; following = i === liveState.current;
    updateFollowUi(); render();
    return;
  }
  closeEvent();
  previous = current;
  current = i;
  enteredAt = Date.now();
  saveDraft();
  pushLive();
  render();
}
$("#b-first").onclick = () => go(0);

document.addEventListener("keydown", e => {

// réparation des diagrammes écrits directement par un modèle (même logique que src/lib/chaoticum/mermaid.ts)
function repairMermaid(code) {
  const lab = (s, max) => { const t = String(s ?? "").replace(/["“”]/g, "'").replace(/[|\r\n]+/g, " ").replace(/\s+/g, " ").trim(); return t.length > max ? `${t.slice(0, max - 1)}…` : t; };
  let m = String(code ?? "").replace(/^```(?:mermaid)?\s*/i, "").replace(/```\s*$/, "").trim();
  if (!/^(flowchart|graph|mindmap)\b/.test(m)) m = `flowchart TD\n${m}`;
  if (/^(flowchart|graph)\b/.test(m)) {
    m = m.replace(/(-->|---|-\.->|==>)\s*([\w-]+):::[\w-]+\s+"([^"]*)"/g, (_s, arrow, id, l) => `${arrow}|"${lab(l, 40)}"| ${id}`)
      .replace(/:::[\w-]+/g, "").replace(/^\s*classDef\b.*$/gm, "")
      .replace(/(\b[\w-]+)\[(?!")([^\]\n]*)\]/g, (_s, id, l) => `${id}["${String(l).replace(/"/g, "'")}"]`)
      .replace(/(\b[\w-]+)\((?![("])([^)\n]*)\)(?!\))/g, (_s, id, l) => `${id}("${String(l).replace(/"/g, "'")}")`);
  }
  return m;
}

// zoom (molette, boutons) et déplacement (glisser) d'un diagramme
function panZoom(box, svg) {
  const inner = el("div", { className: "zoom-inner", innerHTML: svg });
  const wrap = el("div", { className: "zoom-wrap" }, inner);
  let scale = 1, x = 0, y = 0;
  const apply = () => { inner.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; };
  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(8, Math.max(0.2, scale * factor));
    x = cx - ((cx - x) * next) / scale; y = cy - ((cy - y) * next) / scale; scale = next; apply();
  };
  const fit = () => {
    const s = inner.querySelector("svg");
    if (!s) return;
    s.style.maxWidth = "none"; s.style.maxHeight = "none";
    const w = s.getBoundingClientRect().width / scale / frameScale, h = s.getBoundingClientRect().height / scale / frameScale;
    scale = Math.min(wrap.clientWidth / w, wrap.clientHeight / h) * 0.95 || 1;
    x = (wrap.clientWidth - w * scale) / 2; y = (wrap.clientHeight - h * scale) / 2; apply();
  };
  wrap.addEventListener("wheel", e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, (e.clientX - r.left) / frameScale, (e.clientY - r.top) / frameScale); }, { passive: false });
  let drag = null;
  wrap.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; drag = { px: e.clientX, py: e.clientY, x, y }; wrap.setPointerCapture(e.pointerId); wrap.classList.add("dragging"); });
  wrap.addEventListener("pointermove", e => { if (!drag) return; x = drag.x + (e.clientX - drag.px) / frameScale; y = drag.y + (e.clientY - drag.py) / frameScale; apply(); });
  const end = () => { drag = null; wrap.classList.remove("dragging"); };
  wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
  const center = f => zoomAt(f, wrap.clientWidth / 2, wrap.clientHeight / 2);
  wrap.append(el("div", { className: "zoom-tools" },
    el("button", { textContent: "+", title: "Zoomer", onclick: () => center(1.25) }),
    el("button", { textContent: "−", title: "Dézoomer", onclick: () => center(0.8) }),
    el("button", { textContent: "⟲", title: "Ajuster à l'écran", onclick: fit })));
  box.replaceChildren(wrap);
  requestAnimationFrame(fit);
}

// adresse effective d'une contribution (modifiée par l'animateur) et contributions supprimées
const effective = c => ({ ...c, url: overrides.get(c.id)?.url ?? c.url });
const isDeleted = c => !!overrides.get(c.id)?.deleted;
// lien de redirection d'un moteur de recherche (google.com/url?…&url=…) : adresse de destination
function cleanUrl(u) {
  try { const x = new URL(u); if (/(^|\.)google\./.test(x.hostname) && x.pathname === "/url") return x.searchParams.get("url") || x.searchParams.get("q") || u; } catch { /* adresse invalide */ }
  return u;
}
async function editContribution(c) {
  const current = effective(c).url;
  const proposal = cleanUrl(current);
  const url = prompt(`Adresse proposée par ${c.name || "anonyme"}${proposal !== current ? " (lien de redirection : adresse de destination proposée)" : ""} :`, proposal);
  if (!url || url.trim() === current) return;
  if (!/^https?:\/\//i.test(url.trim())) return toast("Adresse invalide (http:// ou https://)");

async function removeContribution(c) {

async function changeContribution(c, change) {

const frameCache = new Map();

async function poll() {
  try {
    const r = await api(`/api/chaoticum/contributions?run=${encodeURIComponent(runId)}`);
    allRows = r.contributions;
    if (started) {
      if (!baseline) baseline = new Set(allRows.map(x => x.id));
      for (const row of allRows) {
        if (baseline.has(row.id) || contributions.has(row.id)) continue;
        contributions.set(row.id, { id: row.id, rowId: row.rowId, name: row.name, url: row.url, date: row.date, receivedAt: new Date().toISOString(), screenIndex: current, shownAt: null, shownScreen: null });

        if (P.screens[current].type === "contribution" && !P.grist.moderation) showContribution(contributions.get(row.id));
      }
      saveDraft();
    }
    if (P.screens[current].type === "contribution") renderContribution();
  } catch (e) {
    if (P.screens[current].type === "contribution") placeholder(`Réponses Grist indisponibles : ${e.message}`);

function participation() {
  return { runId, configItemId: P.configItemId ?? null, title: P.title, mode: "live", startedAt, endedAt: new Date().toISOString(), elapsedSeconds: Math.round((Date.now() - new Date(startedAt).getTime()) / 1000), plannedSeconds: P.durationSeconds, events, contributions: [...contributions.values()], overrides: [...overrides].map(([id, o]) => ({ id, ...o })), transcript };

function saveDraft() { if (started && !REPLAY && !saved) store.set({ startedAt, events, current, enteredAt, contributions: [...contributions.values()], baseline: baseline ? [...baseline] : null, overrides: [...overrides], transcript }); }
function start(draft) {

// Albert : tranches autonomes (un enregistreur par tranche), envoyées dans l'ordre ; les tranches silencieuses sont ignorées
async function startAlbert() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  const ac = new AudioContext();
  const analyser = ac.createAnalyser();
  analyser.fftSize = 2048;
  ac.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  let peak = 0;
  const meter = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    const rms = Math.sqrt(buf.reduce((n, v) => n + v * v, 0) / buf.length);
    peak = Math.max(peak, rms);
    $("#b-mic").style.setProperty("--lvl", Math.min(1, rms * 12).toFixed(2));
  }, 100);
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find(t => MediaRecorder.isTypeSupported(t)) ?? "";
  let stopped = false, rec = null, timer = null, queue = Promise.resolve(), finish;
  const done = new Promise(r => (finish = r));

  async function send(blob, at, screen, duration) {
    try {
      const res = await fetch("/api/chaoticum/transcribe", { method: "POST", body: blob,
        headers: { "Content-Type": blob.type.split(";")[0], "X-Transcription-Prompt": encodeURIComponent(lastText.slice(-200)) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      addSegment({ at: at.toISOString(), duration: Math.round(duration * 10) / 10, screen, text: data.text ?? "", engine: "albert" });
    } catch (e) { toast("Transcription : " + e.message); }
  }
  function cycle() {
    if (stopped) return;
    const at = new Date(), screen = current, parts = [];
    peak = 0;
    const r = (rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {}));
    r.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
    r.onstop = () => {
      const level = peak, duration = (Date.now() - at.getTime()) / 1000;
      const blob = new Blob(parts, { type: r.mimeType || mime || "audio/webm" });
      cycle();
      if (level >= sttCfg.silenceLevel && blob.size > 2000 && duration > 1) queue = queue.then(() => send(blob, at, screen, duration));
      if (stopped) queue.then(() => { clearInterval(meter); stream.getTracks().forEach(t => t.stop()); ac.close(); finish(); });
    };
    r.start();
    timer = setTimeout(() => r.state !== "inactive" && r.stop(), sttCfg.chunkSeconds * 1000);
  }
  cycle();
  return { stop() { stopped = true; clearTimeout(timer); if (rec?.state !== "inactive") rec.stop(); else finish(); return done; } };
}

// navigateur : résultats intermédiaires affichés tout de suite, résultats définitifs enregistrés
function startBrowser() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) throw new Error("reconnaissance vocale indisponible dans ce navigateur (Chrome, Edge ou Safari) : choisir Albert");
  const r = new SR();
  r.lang = sttCfg.language.includes("-") ? sttCfg.language : `${sttCfg.language}-${sttCfg.language.toUpperCase()}`;
  r.continuous = true; r.interimResults = true;
  let stopped = false, segStart = null, segScreen = current;
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const at = segStart ?? new Date();
        addSegment({ at: at.toISOString(), duration: Math.round((Date.now() - at.getTime()) / 100) / 10, screen: segStart ? segScreen : current, text: res[0].transcript, engine: "navigateur" });
        segStart = null;
      } else {
        if (!segStart) { segStart = new Date(); segScreen = current; }
        interim += res[0].transcript;
      }
    }
    if (interim) showCaption(lastText, interim);
  };
  // la reconnaissance s'arrête après un silence : relance tant que la transcription est active
  r.onend = () => { if (!stopped) try { r.start(); } catch { /* déjà relancée */ } };
  r.onerror = e => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) { toast(`Micro indisponible (${e.error})`); stopTranscription(); } };
  r.start();
  return { stop() { stopped = true; r.stop(); return Promise.resolve(); } };
}

// ---------- traits sur les écrans (coordonnées relatives à la zone d'affichage : 0 à 1) ----------
const ink = $("#ink");
// annotations dessinées sur l'écran : traits libres, formes prédéfinies, bulles de texte avec flèche
const INK_KINDS = new Set(["stroke", "shape", "callout"]);
const isInk = a => INK_KINDS.has(a.kind);
const SHAPE_LABELS = { line: "ligne", arrow: "flèche", circle: "cercle", rect: "rectangle", hexagon: "hexagone" };
const BUBBLE = { font: 28, pad: 14, maxWidth: 460, line: 36 };

function arrowHead(g, x0, y0, x1, y1, size) {
  const t = Math.atan2(y1 - y0, x1 - x0);
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x1 - size * Math.cos(t - 0.45), y1 - size * Math.sin(t - 0.45));
  g.lineTo(x1 - size * Math.cos(t + 0.45), y1 - size * Math.sin(t + 0.45));
  g.closePath();
  g.fill();
}
// lignes d'une bulle : mots répartis sur la largeur maximale
function bubbleLines(g, text) {
  const lines = [];

    const next = line ? `${line} ${word}` : word;
    if (line && g.measureText(next).width > BUBBLE.maxWidth - 2 * BUBBLE.pad) { lines.push(line); line = word; } else line = next;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [""];
}

    g.beginPath(); P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
    return;
  }
  const [[x0, y0], [x1, y1]] = P.length >= 2 ? P : [[0, 0], [0, 0]];
  if (a.kind === "shape") {
    const l = Math.min(x0, x1), r = Math.max(x0, x1), t = Math.min(y0, y1), bt = Math.max(y0, y1), cx = (l + r) / 2, cy = (t + bt) / 2;

    if (a.shape === "circle") g.ellipse(cx, cy, (r - l) / 2, (bt - t) / 2, 0, 0, Math.PI * 2);
    else if (a.shape === "rect") g.rect(l, t, r - l, bt - t);

  const t = new Date(ev.enteredAt).getTime() + rElapsed * 1000;
  // adresse et suppression telles qu'elles étaient à l'instant rejoué
  const at = c => { const edits = (c.edits ?? []).filter(e => new Date(e.at).getTime() <= t); return { ...c, url: [...edits].reverse().find(e => e.url)?.url ?? c.url, gone: edits.some(e => e.deleted) }; };
  const received = (R.contributions ?? []).filter(c => new Date(c.receivedAt).getTime() <= t).map(at).filter(c => !c.gone);
  const shows = (R.contributions ?? []).flatMap(c => (c.shows ?? (c.shownAt ? [{ at: c.shownAt, screen: c.shownScreen }] : [])).map(s => ({ ...s, c })))
    .filter(s => s.screen === ev.index && new Date(s.at).getTime() >= new Date(ev.enteredAt).getTime() && new Date(s.at).getTime() <= t)
    .sort((a, b) => a.at.localeCompare(b.at));
  const shownRaw = shows.at(-1)?.c, shown = shownRaw ? received.find(c => c.id === shownRaw.id) : null;
  const key = `${received.length}|${shown?.id ?? ""}`;
  if (!force && list.dataset.key === key) return;
  list.dataset.key = key;
  list.replaceChildren(el("div", { className: "muted", style: "font-size:13px", textContent: `${received.length} contribution(s) reçue(s) à ce moment de la séance` }),
    ...[...received].reverse().map(c => el("div", { className: `c${c.id === shown?.id ? " on" : ""}` }, el("strong", { textContent: c.name || "anonyme" }), el("div", { className: "u", textContent: c.url }))));
  if (shown) displayUrl(shown); else { const main = $("#contrib-main"); if (main) { delete main.dataset.url; placeholder("Aucune contribution affichée à ce moment de la séance."); } }
}

// ==========================================
// Chargement
// ==========================================
// page de suivi : partition, état du direct, personne connectée, grille d'annotation
async function loadFollow() {
  const r = await fetch(`/public/api/suivre?run=${encodeURIComponent(runId ?? "")}`);
  if (r.status === 401) { location.href = `/public/connexion?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  P = d.partition; grid = d.grid ?? []; me = d.user;
  liveState = { session: d.live.session, live: d.live.live, current: d.live.current, enteredAt: d.live.enteredAt };
  transcript = d.live.transcript ?? []; annotations = d.live.annotations ?? [];
  document.title = `${P.title} – suivi`;
  $("#title").textContent = P.title;
  for (const id of ["#b-end", "#b-edit", "#b-mic", "#b-follow"]) $(id).classList.add("hidden");
  document.querySelector("a.home").classList.add("hidden");
  $("#qr-corner").remove();
  $("#who-am-i").replaceChildren(me.name, el("button", { textContent: "Déconnexion", onclick: async () => { await fetch("/public/auth/logout", { method: "POST" }); location.href = "/public/connexion"; } }));
  $("#who-am-i").classList.remove("hidden");
  $("#b-cc").classList.toggle("on", captionsOn());
  $("#b-ink").classList.toggle("on", inkShown());
  $("#progress").replaceChildren(...P.screens.map((s, i) => el("span", { style: `background:var(--t-${s.type});flex:${s.duration}`, title: `${i + 1}. ${LABELS[s.type]} (${mmss(s.duration)})`, onclick: () => go(i) })));
  current = liveState.session ? Math.min(P.screens.length - 1, liveState.current) : 0;
  render();
  updateFollowUi();
  followerEvents();
  toast(`Connecté : ${me.name}`);
}

async function load() {
  if (FOLLOW) return loadFollow();
  if (PUBLIC) {
    if (!token) throw new Error("Lien de rejeu incomplet");
    const r = await api(`/public/api/rejeu?t=${encodeURIComponent(token)}`);
    P = r.partition; R = r.participation; runId = P.runId;
    // lecture seule : ni retour à la liste (privée), ni QR code de participation, ni enregistrement
    document.querySelector("a.home").classList.add("hidden");
    $("#qr-corner").remove();
  } else {
    if (!runId) throw new Error("Partition non précisée (paramètre run)");
    P = await api(`/api/chaoticum/partition?run=${encodeURIComponent(runId)}`);
  }
  document.title = `${P.title} – lecteur`;
  $("#title").textContent = P.title;
  if (!REPLAY) {
    $("#qr-corner").replaceChildren(el("div", { innerHTML: qrSvg(P.grist?.formUrl) }), el("div", { textContent: "Participer" }));
    $("#qr-corner").onclick = () => $("#qr-corner").classList.toggle("small");
  } else $("#qr-corner")?.remove();
  $("#progress").replaceChildren(...P.screens.map((s, i) => el("span", { style: `background:var(--t-${s.type});flex:${s.duration}`, title: `${i + 1}. ${LABELS[s.type]} (${mmss(s.duration)})`, onclick: () => go(i) })));
  $("#b-cc").classList.toggle("on", captionsOn());
  if (REPLAY) {
    $("#b-draw").classList.add("hidden");
    $("#b-follow").classList.add("hidden");
    if (!PUBLIC) R = await api(`/api/chaoticum/participation?run=${encodeURIComponent(runId)}&id=${encodeURIComponent(replayId)}`);
    $("#b-mic").classList.add("hidden");
    if (!R.transcript?.length) { $("#b-cc").classList.add("hidden"); $("#b-transcript").classList.add("hidden"); }
    if (!R.annotations?.length) { $("#b-ink").classList.add("hidden"); $("#b-anns").classList.add("hidden"); }
    $("#b-ink").classList.toggle("on", inkShown());
    $("#replay-ctl").classList.remove("hidden");
    $("#b-end").classList.add("hidden");
    $("#b-back").classList.add("hidden");
    $("#b-edit").classList.add("hidden");
    if (!R.events?.length) throw new Error("Séance sans passage d'écran enregistré");
    replayGo(0);
    overlay(el("h2", { textContent: "Rejeu de la séance" }),
      el("p", {}, `${new Date(R.startedAt).toLocaleString("fr-FR")} · ${R.events.length} passage(s) d'écran · ${(R.contributions ?? []).length} contribution(s) · ${mmss(R.elapsedSeconds ?? 0)}`),
      el("p", { className: "muted", textContent: "Les écrans défilent selon les temps enregistrés (vitesse réglable) ; les contributions apparaissent au moment où elles ont été reçues et affichées." }),
      el("button", { className: "primary", textContent: "Lancer le rejeu", onclick: () => { $("#overlay").classList.add("hidden"); togglePlay(); } }));
    return;
  }
  sttCfg = { ...sttCfg, ...(await api("/api/chaoticum/transcription").catch(() => ({}))) };
  ({ grid = [], publicBase = "" } = await api("/api/chaoticum/live/info").catch(() => ({})));
  $("#b-ink").classList.toggle("on", inkShown());
  presenterEvents();
  $("#b-cc").classList.toggle("on", captionsOn());
  render();
  pollTimer = setInterval(poll, Math.max(3, Number(P.grist.pollSeconds) || 10) * 1000);
  poll();
  const draft = store.get();
  const intro = [el("h2", { textContent: P.title }),
    el("p", {}, `${P.screens.length} écrans · ${mmss(P.durationSeconds)} · graine ${P.seed}`),
    el("p", { className: "muted", textContent: "Navigation : ← → (écran précédent, suivant), Début / Fin, G (aller à), R (revenir), F (plein écran), Q (réduire le QR code), T (transcrire la parole), S (sous-titres). Le chronomètre passe à l'orange puis au rouge quand la durée prévue d'un écran est dépassée." })];
  if (draft?.startedAt) overlay(...intro, el("p", {}, `Une séance commencée le ${new Date(draft.startedAt).toLocaleString("fr-FR")} n'a pas été enregistrée.`),
    el("button", { className: "primary", textContent: "Reprendre cette séance", onclick: () => start(draft) }), " ",
    el("button", { textContent: "Nouvelle séance", onclick: () => { store.clear(); start(null); } }));
  else overlay(...intro, el("button", { className: "primary", textContent: "Démarrer la séance", onclick: () => start(null) }), " ",
    el("button", { textContent: "Parcourir sans enregistrer", onclick: () => { $("#overlay").classList.add("hidden"); $("#mode").textContent = "aperçu"; } }));
  $("#mode").textContent = "aperçu";
}
load().catch(e => overlay(el("h2", { textContent: PUBLIC ? "Rejeu indisponible" : "Partition indisponible" }), el("p", { textContent: e.message }), PUBLIC ? null : el("a", { href: "/", textContent: "Retour à l'application", style: "color:var(--accent)" })));
</script>

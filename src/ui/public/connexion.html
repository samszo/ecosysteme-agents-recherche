<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion – suivre la présentation</title>
<style>
  :root { --bg: #111317; --panel: #1b1e24; --ink: #f1f2f4; --muted: #9aa0aa; --line: #2e323a; --accent: #e48bad; --err: #f0574a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: var(--err); font-size: 14px; }
  .providers { display: grid; gap: 10px; margin: 18px 0; }
  a.btn, button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font: inherit; font-weight: 600; text-decoration: none; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  a.btn:hover, button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1f0a14; }
  .sep { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 14px 0; }
  .sep::before, .sep::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  label { display: block; font-size: 14px; margin: 10px 0 4px; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  form button { margin-top: 14px; }
  .hidden { display: none !important; }
  svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
<main>
  <h1>Suivre la présentation</h1>
  <p class="muted">Connectez-vous pour suivre les écrans et la transcription en direct, et les annoter avec la grille de couleurs.</p>
  <p id="error" class="err hidden"></p>

  <div id="signed" class="hidden">
    <p id="who"></p>
    <div class="providers">
      <a id="continue" class="btn" href="/public/suivre">Continuer</a>
      <button id="logout" type="button">Se déconnecter</button>
    </div>
  </div>

  <div id="choices">
    <div class="providers" id="providers"></div>
    <div id="sep" class="sep hidden">ou</div>
    <form id="local" class="hidden">
      <label for="login">Identifiant</label><input id="login" autocomplete="username" required>
      <label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Se connecter</button>
    </form>
    <p id="none" class="muted hidden">Aucune méthode de connexion n'est configurée : demandez un compte à l'animateur de la séance.</p>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const next = /^\/public\//.test(params.get("next") ?? "") ? params.get("next") : "/public/suivre";
if (params.get("erreur")) { $("#error").textContent = params.get("erreur"); $("#error").classList.remove("hidden"); }
const ICONS = {
  cas: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 2 7l10 5 8-4v6h2V7L12 2zm-6 9.2V15c0 2.2 2.7 4 6 4s6-1.8 6-4v-3.8l-6 3-6-3z"/></svg>',
  google: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6a5.1 5.1 0 0 1-2.2 3.4v2.8h3.6c2.1-1.9 3.2-4.8 3.2-8.3z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.1a6.6 6.6 0 0 1 0-4.2V7H2.1a11 11 0 0 0 0 10l3.7-2.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2.1 7l3.7 2.9C6.7 7.3 9.1 5.4 12 5.4z"/></svg>',
  github: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>',
};
(async () => {
  const p = await (await fetch("/public/auth/providers")).json();
  if (p.user) {
    $("#who").textContent = `Connecté : ${p.user.name} (${{ local: "compte local", google: "Google", github: "GitHub", cas: p.cas?.label ?? "CAS" }[p.user.provider] ?? p.user.provider})`;
    $("#continue").href = next;
    $("#signed").classList.remove("hidden"); $("#choices").classList.add("hidden");
  }
  // CAS de l'établissement (université Paris 8 par défaut) : en premier
  if (p.cas) {
    const a = document.createElement("a");
    a.className = "btn"; a.href = `/public/auth/cas?next=${encodeURIComponent(next)}`; a.innerHTML = `${ICONS.cas}<span></span>`;
    a.querySelector("span").textContent = `Se connecter avec ${p.cas.label}`;
    $("#providers").append(a);
  }
  for (const [k, label] of [["google", "Continuer avec Google"], ["github", "Continuer avec GitHub"]]) {
    if (!p[k]) continue;
    const a = document.createElement("a");
    a.className = "btn"; a.href = `/public/auth/${k}?next=${encodeURIComponent(next)}`; a.innerHTML = `${ICONS[k]}<span></span>`;
    a.querySelector("span").textContent = label;
    $("#providers").append(a);
  }
  $("#local").classList.toggle("hidden", !p.local);
  $("#sep").classList.toggle("hidden", !(p.local && (p.google || p.github || p.cas)));
  $("#none").classList.toggle("hidden", !!(p.local || p.google || p.github || p.cas));
})();
$("#local").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/public/auth/local", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login: $("#login").value, password: $("#password").value, next }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) location.href = d.next || next;
  else { $("#error").textContent = d.error || "Connexion impossible"; $("#error").classList.remove("hidden"); }
};
$("#logout").onclick = async () => { await fetch("/public/auth/logout", { method: "POST" }); location.reload(); };
</script>
</body>
</html>
